<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const gravity = { x: 0, y: 0.3 };
        const trailColors = [
            'rgba(249, 199, 79, 0.8)',
            'rgba(249, 132, 74, 0.8)',
            'rgba(248, 150, 30, 0.8)',
            'rgba(243, 114, 44, 0.8)',
            'rgba(249, 65, 68, 0.8)'
        ];

        class Particle {
            constructor(x, y, isFirework, color) {
                this.pos = { x, y };
                this.origin = { x, y };
                this.vel = isFirework
                    ? { x: 0, y: -Math.random() * 15 - 15 }
                    : { x: (Math.random() - 0.5) * 10, y: (Math.random() - 0.5) * 10 };
                this.acc = { x: 0, y: 0 };
                this.size = isFirework ? 4 : Math.random() * 2 + 1;
                this.color = color;
                this.isFirework = isFirework;
                this.lifespan = 100;
                this.trails = [];
                for (let i = 0; i < 5; i++) {
                    this.trails.push({ x, y });
                }
            }

            applyForce(force) {
                this.acc.x += force.x;
                this.acc.y += force.y;
            }

            update() {
                if (!this.isFirework) {
                    this.vel.x *= 0.95;
                    this.vel.y *= 0.95;
                    this.lifespan -= 1;
                }

                this.vel.x += this.acc.x;
                this.vel.y += this.acc.y;
                this.pos.x += this.vel.x;
                this.pos.y += this.vel.y;

                this.acc.x = 0;
                this.acc.y = 0;

                this.trails.pop();
                this.trails.unshift({ x: this.pos.x, y: this.pos.y });
            }

            draw() {
                for (let i = 0; i < this.trails.length; i++) {
                    const trail = this.trails[i];
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, this.size - i * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = trailColors[i % trailColors.length];
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            isDead() {
                return this.lifespan <= 0;
            }
        }

        class Firework {
            constructor() {
                this.firework = new Particle(
                    Math.random() * canvas.width,
                    canvas.height,
                    true,
                    'white'
                );
                this.exploded = false;
                this.particles = [];
            }

            update() {
                if (!this.exploded) {
                    this.firework.applyForce(gravity);
                    this.firework.update();

                    if (this.firework.vel.y >= 0) {
                        this.exploded = true;
                        this.explode();
                    }
                } else {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.applyForce(gravity);
                        p.update();

                        if (p.isDead()) {
                            this.particles.splice(i, 1);
                        }
                    }
                }
            }

            explode() {
                const particleCount = Math.random() * 50 + 50;
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    const color = trailColors[Math.floor(Math.random() * trailColors.length)];

                    this.particles.push(
                        new Particle(
                            this.firework.pos.x,
                            this.firework.pos.y,
                            false,
                            color
                        )
                    );
                }
            }

            draw() {
                if (!this.exploded) {
                    this.firework.draw();
                }
                this.particles.forEach((p) => p.draw());
            }

            isDone() {
                return this.exploded && this.particles.length === 0;
            }
        }

        const fireworks = [];

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.05) {
                fireworks.push(new Firework());
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();

                if (fireworks[i].isDone()) {
                    fireworks.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
